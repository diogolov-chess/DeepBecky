name: Build and Release Deep Becky

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (${{ matrix.profile }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: bmi2
            flags: "PROFILE=bmi2"
            suffix: "windows-x64-bmi2"
          - profile: avx2
            flags: "PROFILE=avx2"
            suffix: "windows-x64-avx2"
          - profile: sse42
            flags: "PROFILE=sse42"
            suffix: "windows-x64-sse42"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            mingw-w64-x86_64-gcc

      - name: Compile Deep Becky Engine
        shell: msys2 {0}
        run: |
          cd src
          make clean
          make -j2 ${{ matrix.flags }}

      - name: Package Release Assets
        shell: pwsh
        run: |
          $pkgDir = "DeepBecky-3.0-${{ matrix.suffix }}"
          if (Test-Path $pkgDir) { Remove-Item -Recurse -Force $pkgDir }
          New-Item -ItemType Directory -Path $pkgDir -Force
          Copy-Item "src/DeepBecky_3.0.exe" -Destination "$pkgDir/DeepBecky_3.0.exe"
          Copy-Item "src/db-leela500m-v5.nnue" -Destination "$pkgDir/db-leela500m-v5.nnue"
          Copy-Item "README.md" -Destination "$pkgDir/README.md"
          Copy-Item "LICENSE" -Destination "$pkgDir/LICENSE"
          if (Test-Path "$pkgDir.zip") { Remove-Item -Force "$pkgDir.zip" }
          Compress-Archive -Path "$pkgDir/*" -DestinationPath "$pkgDir.zip" -Force

      - name: Upload Release Asset
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v3.0"
          files: DeepBecky-3.0-${{ matrix.suffix }}.zip

      - name: Upload Artifact (CI Test)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: DeepBecky-3.0-${{ matrix.suffix }}
          path: DeepBecky-3.0-${{ matrix.suffix }}.zip

  build-linux:
    name: Linux (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: bmi2
            flags: "PROFILE=bmi2"
            suffix: "linux-x64-bmi2"
          - profile: avx2
            flags: "PROFILE=avx2"
            suffix: "linux-x64-avx2"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Compile Deep Becky Engine
        run: |
          cd src
          make clean
          make -j$(nproc) ${{ matrix.flags }}

      - name: Package Release Assets
        run: |
          PKG_DIR="DeepBecky-3.0-${{ matrix.suffix }}"
          rm -rf "$PKG_DIR" "$PKG_DIR.tar.gz"
          mkdir -p "$PKG_DIR"
          cp src/DeepBecky_3.0 "$PKG_DIR/DeepBecky_3.0"
          cp src/db-leela500m-v5.nnue "$PKG_DIR/db-leela500m-v5.nnue"
          cp README.md "$PKG_DIR/README.md"
          cp LICENSE "$PKG_DIR/LICENSE"
          tar -czvf "$PKG_DIR.tar.gz" -C "$PKG_DIR" .

      - name: Upload Release Asset
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v3.0"
          files: DeepBecky-3.0-${{ matrix.suffix }}.tar.gz

      - name: Upload Artifact (CI Test)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: DeepBecky-3.0-${{ matrix.suffix }}
          path: DeepBecky-3.0-${{ matrix.suffix }}.tar.gz
